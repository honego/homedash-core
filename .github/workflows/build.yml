---
name: "Build"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - { goos: linux, goarch: "386", output: "386" }
          - { goos: linux, goarch: amd64, output: "amd64" }
          - { goos: linux, goarch: arm, goarm: "5", output: "armv5" }
          - { goos: linux, goarch: arm, goarm: "6", output: "armv6" }
          - { goos: linux, goarch: arm, goarm: "7", output: "armv7" }
          - { goos: linux, goarch: arm64, output: "arm64" }
          - { goos: linux, goarch: mips64, output: "mips64" }
          - { goos: linux, goarch: mips64le, output: "mips64le" }
          - { goos: linux, goarch: riscv64, output: "riscv64" }
          - { goos: linux, goarch: loong64, output: "loong64" }
          - { goos: linux, goarch: s390x, output: "s390x" }
          - { goos: linux, goarch: ppc64le, output: "ppc64le" }

          # MacOS
          - { goos: darwin, goarch: amd64, output: amd64 }
          - { goos: darwin, goarch: arm64, output: arm64 }

          # Windows
          - { goos: windows, goarch: "386", output: "386" }
          - { goos: windows, goarch: amd64, output: amd64 }
          - { goos: windows, goarch: arm64, output: arm64 }

          # FreeBSD
          - { goos: freebsd, goarch: "386", output: "386" }
          - { goos: freebsd, goarch: amd64, output: amd64 }
          - { goos: freebsd, goarch: arm64, output: arm64 }

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Setup Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: "Set variables"
        run: |
          PROJECT_NAME="${GITHUB_REPOSITORY##*/}"
          VERSION="${GITHUB_REF_NAME,,}"
          VERSION="${VERSION//\//-}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          fi
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$GIT_COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

      - name: "Build core"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
        run: |
          set -euxo pipefail
          go env
          go build -v -trimpath -ldflags="-s -w -buildid= \
            -X github.com/honeok/homedash-core/internal/core.Version=$VERSION \
            -X github.com/honeok/homedash-core/internal/core.GitCommit=$GIT_COMMIT \
            -X github.com/honeok/homedash-core/internal/core.BuildTime=$BUILD_TIME"

          if [ ${{ matrix.goos }} = "windows" ]; then
            dist=homedash-${{ matrix.goos }}-${{ matrix.output }}.exe
            mv $PROJECT_NAME.exe $dist
          else
            dist=homedash-${{ matrix.goos }}-${{ matrix.output }}
            mv $PROJECT_NAME $dist
          fi
          zip -9v homedash-${{ matrix.goos }}-${{ matrix.output }}-$VERSION.zip $dist

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.output }}
          path: homedash*.zip
          if-no-files-found: error
          retention-days: 1
